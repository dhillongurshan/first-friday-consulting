/* ===== ORDER PAPER: exclusive native accordion ===== */
.op{border-top:1px solid var(--ink)}
.op details{border-bottom:1px solid var(--line)}
.op summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:baseline;padding:clamp(20px,2.6vw,30px) 0;user-select:none}
.op summary::-webkit-details-marker{display:none}
.op .n{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--gold)}
.op summary h3{font-family:var(--serif);font-weight:700;font-size:clamp(24px,2.8vw,34px);line-height:1.05;letter-spacing:-.01em;margin:0}
.op .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:14px}
.op .tag i{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .35s cubic-bezier(.2,.7,.2,1),background .2s}
.op .tag i::before,.op .tag i::after{content:"";position:absolute;background:var(--ink);width:11px;height:1.5px}
.op .tag i::after{transform:rotate(90deg);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.op details[open] .tag i{background:var(--gold);border-color:var(--gold)}
.op details[open] .tag i::after{transform:rotate(0)}
.op summary:hover h3{color:var(--gold)}
.op summary:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
/* animated open/close, native */
.op details::details-content{block-size:0;overflow:clip;transition:block-size .45s cubic-bezier(.2,.7,.2,1),content-visibility .45s allow-discrete}
.op details[open]::details-content{block-size:auto}
.op .body{display:grid;grid-template-columns:64px 1fr;gap:20px;padding:0 0 clamp(28px,3.4vw,44px)}
.op .body>*{grid-column:2}
/* body copy, unchanged from the site */
.op .copy{margin:0 0 16px;font-size:17px;line-height:1.6;color:var(--ink-soft);max-width:38em}
.op .copy:last-child{margin-bottom:0}
/* agency: scroll-snap rail */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 14px;margin:0 -24px;padding-inline:24px;scrollbar-width:none;scroll-padding-inline:24px}
.rail::-webkit-scrollbar{display:none}
.rail li{list-style:none;flex:0 0 200px;scroll-snap-align:start;border:1px solid var(--line);background:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:136px}
.rail .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-soft)}
.rail svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-top:-4px}
.rail b{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.2;margin-top:auto}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 18px}
@media (max-width:760px){
  .op summary{grid-template-columns:40px 1fr auto;gap:12px}
.op .body{grid-template-columns:1fr}.op .body>*{grid-column:1}
.op .tag span{display:none}
.rail li{flex-basis:168px}
@media (prefers-reduced-motion:reduce){.op details::details-content,.op .tag i,.op .tag i::after{transition:none}}
</style>
