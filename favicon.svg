<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Marketing by Committee mark, simplified for icon sizes: the square with
       the three dots over its top-right corner, proportions from logo.png.
       Transparent background; ink shapes flip to cream in dark-mode tab bars. -->
  <style>
    .ink { fill: #14151a; }
    .ink-stroke { stroke: #14151a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #fafaf8; }
      .ink-stroke { stroke: #fafaf8; }
    }
  </style>
  <mask id="dot-gap">
    <rect width="32" height="32" fill="#fff"/>
    <circle cx="18.9" cy="11.2" r="2.2" fill="#000"/>
    <circle cx="23.1" cy="11.2" r="2.2" fill="#000"/>
    <circle cx="27.3" cy="11.2" r="2.2" fill="#000"/>
  </mask>
  <rect class="ink-stroke" x="3.5" y="5" width="22" height="22" fill="none" stroke-width="1.5" mask="url(#dot-gap)"/>
  <circle class="ink" cx="18.9" cy="11.2" r="1.5"/>
  <circle class="ink" cx="23.1" cy="11.2" r="1.5"/>
  <circle cx="27.3" cy="11.2" r="1.5" fill="#a8894a"/>
</svg>
